name: Build YouBili APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        id: unzip
        run: |
          if [ -f YouBili-Android-fixed.zip ]; then
            ZIP=YouBili-Android-fixed.zip
          else
            ZIP=YouBili-Android-mobile-cloud-build.zip
          fi
          echo "使用: $ZIP"
          unzip -q "$ZIP" -d extracted
          if [ -f extracted/YouBili-Android/settings.gradle.kts ]; then
            echo "dir=extracted/YouBili-Android" >> $GITHUB_OUTPUT
          else
            echo "dir=extracted" >> $GITHUB_OUTPUT
          fi
          ls -la extracted/YouBili-Android/ || ls -la extracted/

      - name: Build debug APK
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouBili-debug-apk
          path: ${{ steps.unzip.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
